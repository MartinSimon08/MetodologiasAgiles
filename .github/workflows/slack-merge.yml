name: Avisar en Slack al mergear

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: slack-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  avisar:
    name: Publicar aviso
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar mensaje a Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_CUERPO: ${{ github.event.pull_request.body }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTOR: ${{ github.event.pull_request.user.login }}
          PR_RAMA: ${{ github.event.pull_request.head.ref }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::notice::Falta el secret SLACK_WEBHOOK_URL. Se omite el aviso en Slack."
            exit 0
          fi

          payload="$(
            jq -n \
              --arg titulo "${PR_TITULO}" \
              --arg cuerpo "${PR_CUERPO}" \
              --arg numero "${PR_NUMERO}" \
              --arg url "${PR_URL}" \
              --arg autor "${PR_AUTOR}" \
              --arg rama "${PR_RAMA}" \
              --arg repo "${REPOSITORIO}" \
              '
          def una_linea:
            gsub("[\r\n\t]+"; " ") | gsub("^ +| +$"; "");

          def recortar:
            if length > 300 then .[0:297] + "..." else . end;

          def texto($valor; $vacio):
            ($valor | una_linea) as $limpio
            | (if $limpio == "" then $vacio else $limpio end)
            | recortar;

          def escapar_mrkdwn:
            gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;") | gsub("[`*]"; "\u0027");

          def issues:
            ($cuerpo // "")
            | split("\n")
            | map(capture("^Closes #(?<n>[0-9]+)\\s*$")? | .n | tonumber)
            | unique
            | map(tostring);

          def repo_valido:
            $repo | test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$");

          def url_valida:
            ($numero | test("^[0-9]+$"))
            and ($url | test("^https://github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/pull/[0-9]+$"))
            and ($url | endswith("/" + $numero));

          (texto($titulo; "Sin título") | escapar_mrkdwn) as $titulo_visible
          | (texto($autor; "desconocido") | escapar_mrkdwn) as $autor_visible
          | (texto($rama; "desconocida") | escapar_mrkdwn) as $rama_visible
          | (texto($numero; "?") | escapar_mrkdwn) as $numero_visible
          | (issues) as $issues
          | (if ($issues | length) > 20 then $issues[0:20] else $issues end) as $issues_visibles
          | (if url_valida then "<\($url)|#\($numero)>" else "#" + $numero_visible end) as $enlace_pr
          | (if ($issues | length) == 0 then []
             else
               [
                 "Cierra "
                 + (
                   $issues_visibles
                   | map(if repo_valido then "<https://github.com/\($repo)/issues/\(.)|#\(.)>" else "#" + . end)
                   | join(", ")
                 )
                 + (if ($issues | length) > 20 then " y otros" else "" end)
               ]
             end) as $cierra
          | {
              text: ("Se mergeó el pull request #" + $numero_visible + ": " + $titulo_visible),
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: "Se mergeó un pull request",
                    emoji: false
                  }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: ("*" + $titulo_visible + "*") }
                },
                {
                  type: "context",
                  elements: [
                    {
                      type: "mrkdwn",
                      text: (
                        [$enlace_pr, ("por *" + $autor_visible + "*"), ("desde `" + $rama_visible + "`")]
                        + $cierra
                        | join("  ·  ")
                      )
                    }
                  ]
                }
              ]
            }
          '
          )"

          if ! curl --fail --silent --proto '=https' --max-time 20 --output /dev/null \
            --request POST \
            --header "Content-Type: application/json; charset=utf-8" \
            --data "${payload}" \
            --url "${SLACK_WEBHOOK_URL}"; then
            echo "::error::No se pudo publicar el aviso en Slack."
            exit 1
          fi
