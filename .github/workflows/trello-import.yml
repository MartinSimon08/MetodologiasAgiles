name: Importar Sprint Backlog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Solo vista previa (no crea issues ni adjuntos)
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: trello-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Importar tarjetas
        run: node script/trello-sync.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ github.token }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
