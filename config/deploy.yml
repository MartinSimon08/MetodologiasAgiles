service: metodologias_agiles

image: metodologias_agiles

servers:
  web:
    - 204.216.155.6

proxy:
  ssl: true
  host: 204-216-155-6.sslip.io
  healthcheck:
    path: /api/up

registry:
  server: localhost:5555

env:
  secret:
    - SECRET_KEY_BASE
    - METODOLOGIAS_AGILES_DATABASE_PASSWORD
  clear:
    DB_HOST: metodologias_agiles-db
    RAILS_MAX_THREADS: 3

ssh:
  user: ubuntu

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "metodologias_agiles_storage:/rails/storage"

builder:
  arch: amd64

accessories:
  db:
    image: postgres:16
    host: 204.216.155.6
    env:
      clear:
        POSTGRES_USER: metodologias_agiles
        POSTGRES_DB: metodologias_agiles_production
      secret:
        - POSTGRES_PASSWORD
    cmd: >-
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=192MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
    directories:
      - data:/var/lib/postgresql/data
