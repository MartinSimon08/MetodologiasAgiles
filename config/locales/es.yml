es:
  activerecord:
    models:
      usuario: Usuario
      cliente: Cliente
      orden: Orden
      adelanto: Adelanto
      tarea: Tarea
      repuesto: Repuesto
      repuesto_catalogo: Repuesto del catálogo
      tarea_frecuente: Tarea frecuente
      vehiculo: Vehículo
    attributes:
      usuario:
        nombre: Nombre
        email: Email
        rol: Rol
        password: Contraseña
        activo: Activo
      cliente:
        nombre: Nombre
        telefono: Teléfono
        email: Email
      orden:
        cliente: Cliente
        vehiculo: Vehículo
        motivo: Motivo de ingreso
        estado: Estado
        cancelada_en: Fecha de cancelación
        cerrada_en: Fecha de cierre
        cerrada_por: Cerrada por
        total_cerrado: Total al cierre
      adelanto:
        orden: Orden
        importe: Importe
        registrado_en: Fecha de registro
      tarea:
        orden: Orden
        mecanico: Mecánico
        descripcion: Descripción
        estado: Estado
        precio: Precio
      tarea_frecuente:
        descripcion: Descripción
        precio_sugerido: Precio sugerido
      repuesto:
        orden: Orden
        descripcion: Descripción
        cantidad: Cantidad
        costo_unitario: Costo unitario real
        margen: Margen
        estado: Estado
        comprobante: Foto del comprobante
        repuesto_catalogo: Repuesto del catálogo
        registrado_por: Administrador
      repuesto_catalogo:
        nombre: Nombre
      vehiculo:
        cliente: Dueño
        patente: Patente
        marca: Marca
        modelo: Modelo
        anio: Año
        kilometraje: Kilometraje
        ultimo_costo: Último costo
    errors:
      messages:
        record_invalid: "La validación falló: %{errors}"
        restrict_dependent_destroy:
          has_one: No se puede eliminar porque existe un %{record} dependiente
          has_many: No se puede eliminar porque existen %{record} dependientes
      models:
        usuario:
          attributes:
            base:
              ya_desactivado: El usuario ya está desactivado
              ultimo_administrador: No se puede desactivar al último administrador activo
        adelanto:
          attributes:
            orden:
              must_be_open: debe estar abierta
            importe:
              mayor_que_monto_final: no puede ser mayor al monto final de la orden
        orden:
          attributes:
            vehiculo:
              con_orden_abierta: ya tiene una orden abierta
            base:
              repuestos_pendientes: No se puede cerrar la orden porque tiene repuestos pendientes de valorizar
              ya_cancelada: La orden ya está cancelada
              cerrada_no_cancelable: No se puede cancelar una orden cerrada
              ya_cerrada: La orden ya está cerrada
              cancelada_no_cerrable: No se puede cerrar una orden cancelada
              tareas_en_curso: No se puede cerrar la orden porque tiene tareas tomadas o en curso
              tareas_pendientes: Hay tareas pendientes sin tomar. Confirmá que se descartan para cerrar la orden
              total_parcial_no_disponible: El total parcial solo se calcula en órdenes abiertas
        repuesto:
          attributes:
            estado:
              ya_valorizado: ya fue valorizado
              ya_quitado: ya fue quitado de la orden
            orden:
              cerrada: está cerrada
              cancelada: está cancelada
            comprobante:
              en_blanco: no puede estar en blanco
              demasiado_grande: no puede superar 8 MB
              tipo_invalido: tiene que ser JPG, PNG o WebP
            base:
              costo_en_pendiente: El costo y el margen de un repuesto pendiente se cargan con valorizar
              supera_adelantos: El nuevo total quedaría por debajo de los adelantos ya registrados
        tarea:
          attributes:
            estado:
              no_disponible: ya fue tomada por otro mecánico
              no_en_curso: no está en curso
            orden:
              cerrada: está cerrada
              cancelada: está cancelada
        vehiculo:
          attributes:
            cliente:
              mismo_duenio: ya es el dueño de este vehículo
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: no puede estar en blanco
      present: debe estar en blanco
      taken: ya está en uso
      invalid: no es válido
      inclusion: no está incluido en la lista
      too_short: es demasiado corta (mínimo %{count} caracteres)
      too_long: es demasiado larga (máximo %{count} caracteres)
      password_too_long: es demasiado larga
      confirmation: no coincide con %{attribute}
      required: debe existir
      not_a_number: debe ser un número
      not_an_integer: debe ser un número entero
      greater_than: debe ser mayor que %{count}
      greater_than_or_equal_to: debe ser mayor o igual que %{count}
      less_than: debe ser menor que %{count}
      less_than_or_equal_to: debe ser menor o igual que %{count}
